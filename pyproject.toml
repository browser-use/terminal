[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-use-terminal"
version = "0.1.8"
description = "A browser-specific LLM harness built around raw CDP, durable sessions, and screenshot timelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.14.3",
  "cdp-use==1.4.5",
  "curl-cffi>=0.13.0",
  "fetch-use==0.4.0",
  "lxml>=6.1.0",
  "pandas>=2.3.3",
  "pillow==12.2.0",
  "pypdf>=6.10.2",
  "requests>=2.31",
  "tabulate>=0.9.0",
  "websocket-client>=1.8",
  "websockets==15.0.1",
]

[project.scripts]
browser-use-terminal = "llm_browser_worker.rust_cli:main"
but = "llm_browser_worker.rust_cli:tui_main"
browser-use-terminal-ui = "llm_browser_worker.rust_cli:tui_main"
browser-harness = "browser_harness.run:main"
browser-harness-manager = "browser_harness.manager_daemon:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
